<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Real English</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>

<body>

    <div th:replace="common/header :: header"></div>

    <main>
        <form th:action="@{/search}" method="get" class="search-form">
            <p>カテゴリー：</p>
            <select name="category" class="search-select">
                <option value="">すべて</option>
                <option value="仕事中" th:selected="${category == '仕事中'}">仕事中</option>
                <option value="プライベート中" th:selected="${category == 'プライベート中'}">プライベート中</option>
                <option value="トラブル中" th:selected="${category == 'トラブル中'}">トラブル中</option>
                <option value="食事中" th:selected="${category == '食事中'}">食事中</option>
                <option value="その他" th:selected="${category == 'その他'}">その他</option>
            </select>
            <button type="submit">検索</button>
        </form>
        <p th:if="${message}" th:text="${message}" class="message"></p>
        <table class="word-table">
            <tr>
                <th>リアルフレーズ</th>
                <th>意味</th>
                <th>コメント</th>
                <th>カテゴリ</th>
                <th>投稿者</th>
            </tr>
            <tr th:each="word : ${words}">
                <td th:text="${word.english}"></td>
                <td th:text="${word.meaning}"></td>
                <td th:text="${word.comment}"></td>
                <td th:text="${word.category}"></td>
                <!-- user.usernameはwordオブジェクト経由で、登録したユーザーのusernameを表示 -->
                <td th:text="${word.user.username}"></td>
            </tr>

        </table>

    </main>

    <div th:replace="common/footer :: footer"></div>

</body>

</html>
